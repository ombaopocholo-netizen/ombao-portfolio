<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <header style="text-align: center; background-color:rgb(255, 255, 255); gap: 20px; padding: 10px; justify-content:center;">
        <h2>Student Registration Form</h2>
    </header>

    <nav style="background-color:rgb(247, 157, 125);display: flex; gap: 20px; padding: 10px; justify-content:center;">
        <a href="StudentPersonalWebsite.html" style="color: rgb(255, 255, 255);">Home</a>
        <a href="RegistrationForm.html" style="color: rgb(255, 255, 255);">Registration Form</a>
        <a href="GradeReport.html" style="color: rgb(255, 255, 255);">Grade Table</a>
        <a href="MyProfile.html" style="color: rgb(255, 255, 255);">My Profile</a>
    </nav>

    <br>
    <form >
    First name:  <br>   <input type="text" name="first_name" />
    <br>
    <br>
    Last name:  <br> <input type="text" name="last_name" />
    <br>
    <br>
    Email:  <br> <input type="text" name="Email" />
    <br>
    <br>
    Gender <br>
        <input type="radio" name="Gender" value="Male"> Male
        <input type="radio" name="Gender" value="Female"> Female
    <br>
    <br>
    Course <br>
    <select name="dropdown">
        <option value="BSCS" selected>BSCS</option>
        <option value="BSIT">BSIT</option>
        <option value="BSHM">BSHM</option>
        <option value="BSTM">BSTM</option>
    </select>
    <br>
    <br>
    Skills <br>
    <input type="checkbox" name="HTML" value="on"> HTML
    <input type="checkbox" name="CSS" value="on"> CSS
    <input type="checkbox" name="JavaScript" value="on"> JavaScript
    <br><br>
    Upload Picture <br>
    <input type="file" value="photo">
    <br>
    <br>

    Address <br>
    <textarea rows="5" cols="50" name="description" placeholder=” Enter description here...”></textarea>
    <br>
    <br>
    <input type="submit" name="submit" value="Submit" />
    <input type="reset" name="reset"  value="Reset" />

    </form>
    
    <div style="text-align:center; display: flex;"></div>
        <section style="background-color: burlywood; flex: 500px;">
            <p>@Class 2026</p>
        </section>
    </div>


</body>
</html>
